name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          # 캐시 문제는 일단 배제하기 위해 주석 처리
          # cache: 'npm'

      - name: Install Root Dependencies (Verbose)
        # --verbose를 추가하여 설치 중 멈추면 어디서 멈추는지 확인
        run: npm ci --legacy-peer-deps --verbose

      - name: Install Functions Dependencies
        # functions 폴더의 의존성 설치
        run: cd functions && npm ci --verbose && cd ..

      - name: Lint
        run: npm run lint

      - name: Test
        # --pool=forks 옵션으로 CI 멈춤 현상 방지
        run: npm run test -- --run --pool=forks --reporter=verbose
        env:
          # GitHub Secrets에서 설정한 환경 변수 주입 (필수)
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_LINE_LOGIN_CHANNEL_ID: ${{ secrets.VITE_LINE_LOGIN_CHANNEL_ID }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}

      - name: Build Frontend
        run: npm run build

      - name: Build Functions
        run: cd functions && npm run build
