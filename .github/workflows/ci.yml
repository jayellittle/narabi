name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Functions Dependencies
        run: cd functions && npm ci && cd ..

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --run

      - name: Create .env file for build
        run: |
          cat > .env << EOF
          VITE_FIREBASE_API_KEY=dummy-key-for-ci
          VITE_FIREBASE_AUTH_DOMAIN=dummy.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=dummy-project
          VITE_FIREBASE_STORAGE_BUCKET=dummy.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID=123456789
          VITE_FIREBASE_APP_ID=dummy-app-id
          VITE_LINE_LOGIN_CHANNEL_ID=dummy-line-id
          VITE_APP_URL=http://localhost:5173
          EOF

      - name: Build
        run: npm run build

      - name: Build Functions
        run: cd functions && npm run build && cd ..
