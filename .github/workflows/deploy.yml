name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Create .env file
        run: |
          cat > .env << EOF
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_LINE_LOGIN_CHANNEL_ID=${{ secrets.VITE_LINE_LOGIN_CHANNEL_ID }}
          VITE_APP_URL=${{ secrets.VITE_APP_URL }}
          EOF

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Functions Dependencies
        run: cd functions && npm ci && cd ..

      - name: Build
        run: npm run build

      - name: Build Functions
        run: cd functions && npm run build && cd ..

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_NARABI_A8765 }}'
          channelId: live
          projectId: narabi-a8765
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
