name: Deploy to Firebase on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Create .env file
        run: |
          cat > .env << EOF
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_LINE_LOGIN_CHANNEL_ID=${{ secrets.VITE_LINE_LOGIN_CHANNEL_ID }}
          VITE_APP_URL=${{ secrets.VITE_APP_URL }}
          EOF

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Functions Dependencies
        run: cd functions && npm ci && cd ..

      - name: Build Frontend
        run: npm run build

      - name: Build Functions
        run: cd functions && npm run build && cd ..

      - name: Deploy to Firebase (All)
        run: |
          npm install -g firebase-tools
          firebase deploy --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive
        env:
          # 주의: FIREBASE_TOKEN은 CI/CD용 토큰(firebase login:ci로 생성)이 필요합니다.
          # 기존 Service Account를 계속 사용하려면 google-github-actions/auth 등을 사용해야 할 수 있습니다.
          # 가장 간단한 방법은 firebase login:ci 로 얻은 토큰을 GitHub Secrets에 FIREBASE_TOKEN으로 등록하는 것입니다.
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
